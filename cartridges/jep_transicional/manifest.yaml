    name: "Acto Legislativo 01 de 2017 y Sistema Integral"
    path: "corpus/01_marco_constitucional"
  - id: "leyes_procedimiento"
    name: "Ley Estatutaria 1957 de 2019, Ley 1820 de 2016 y Ley 1922 de 2018"
    path: "corpus/02_leyes_y_procedimiento"
  - id: "macrocasos_jurisprudencia"
    name: "Macrocasos JEP (01 al 11), Autos de Determinación de Hechos y TOAR"
    path: "corpus/03_macrocasos_y_jurisprudencia"

rag_parameters:
  chunk_strategy: "legal_hierarchical"
  chunk_size_tokens: 650
  chunk_overlap_tokens: 120
  mandatory_citations: true
  min_relevance_score: 0.65
