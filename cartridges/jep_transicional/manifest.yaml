name: "jep_transicional"
display_name: "Jurisdicción Especial para la Paz (JEP) & Justicia Transicional"
version: "1.0.0"
domain: "justicia_transicional"
jurisdiction: "Colombia / Sistema Integral de Verdad, Justicia, Reparación y No Repetición (SIVJRNR)"
description: >
  Cartucho dogmático especializado en Justicia Transicional, Sistema Restaurativo,
  Derecho Internacional Humanitario (DIH), Estatuto de Roma y jurisprudencia
  de la Jurisdicción Especial para la Paz (JEP). Cubre los Macrocasos 01 al 11,
  régimen de condicionalidad, amnistías, indultos y Sanciones Propias (TOAR).

corpus_structure:
